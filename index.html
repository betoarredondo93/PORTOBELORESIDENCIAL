<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Porto Belo Residencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Serif+Display:ital@0;1&family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  /* Sin scroll-behavior: smooth. El tour virtual mide 1000vh y un scroll
     animado lo atravesaría entero, disparando cientos de seeks al video.
     Los saltos de ancla son instantáneos a propósito. */
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    font-family: var(--font-body, 'Public Sans'), system-ui, sans-serif;
    color: var(--ink, #1A1A1A);
    background: var(--bg, #F5F0E8);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  :root {
    --bg: #F5F0E8;
    --surface: #FFFFFF;
    --accent: #C9BFA8;
    --accent-deep: #A99E81;
    --ink: #1A1A1A;
    --ink-soft: #5A554B;
    --line: #E2DACB;
    --wa: #1FAB54;
    --font-head: 'Playfair Display';
    --font-body: 'Public Sans';
  }
  h1, h2, h3, h4 { font-family: var(--font-head), Georgia, serif; font-weight: 500; margin: 0; line-height: 1.04; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--ink); color: var(--bg); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
  .eyebrow {
    font-family: var(--font-body), sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent-deep);
  }
  .btn {
    font-family: var(--font-body), sans-serif;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    padding: 14px 26px; border-radius: 2px; transition: all .25s ease; white-space: nowrap;
  }
  .btn-dark { background: var(--ink); color: var(--bg); }
  .btn-dark:hover { background: #000; transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .btn-outline:hover { background: var(--ink); color: var(--bg); }
  .btn-wa { background: var(--wa); color: #fff; }
  .btn-wa:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-full { width: 100%; }

  /* striped image placeholder */
  .ph {
    position: relative; overflow: hidden;
    background-color: var(--accent);
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 2px, transparent 2px 13px);
    display: flex; align-items: flex-end; justify-content: flex-start;
  }
  .ph span {
    font-family: 'SFMono-Regular', ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.04em; color: #2c2818;
    background: rgba(245,240,232,.82); padding: 6px 10px; margin: 12px;
    border: 1px solid rgba(0,0,0,.08);
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field select {
    font-size: 15px; padding: 12px 14px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 2px; transition: border-color .2s ease;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field input::placeholder { color: #b7b0a2; }

  .reveal { opacity: 1; transform: none; transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
  html.js-anim .reveal:not(.in) { opacity: 0; transform: translateY(22px); }
  @media (prefers-reduced-motion: reduce) { .reveal { transition: none; } }

  @media (max-width: 900px) {
    .wrap { padding: 0 22px; }
  }
  @media (max-width: 760px) {
    .pb-hero-grid { grid-template-columns: 1fr !important; gap: 34px !important; }
    .pb-carousel { height: 380px !important; }
    .pb-hero-img > div:first-child { inset: -14px -14px 18px 18px !important; top: -14px; }
    .pb-stats { grid-template-columns: 1fr 1fr !important; }
    .pb-stats > div { border-left: none !important; border-top: 1px solid rgba(255,255,255,.12); }
    .pb-stats > div:nth-child(odd) { border-left: none !important; }
    .pb-stats > div:nth-child(even) { border-left: 1px solid rgba(255,255,255,.12) !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
